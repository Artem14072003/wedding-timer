<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
    />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <link rel="stylesheet" href="./css/style.css" />
    <title>Свадебный таймер!</title>
  </head>
  <body>
    <main class="main">
      <div class="timer_container wrapper">
        <div class="timer_container-imgs">
          <div class="timer_container-img img-zhenya"></div>
          <div class="timer_container-img img-danya"></div>
          <div class="timer_container-img_forever">
              <img src="./img/love_forever.jpg" alt="Zheny&Dany" />
          </div>
        </div>

        <div class="timer_container-content">
          <h2 class="timer_container-title title">До росписи осталось:</h2>

          <div class="timer_container-times">
            <h3 class="timer_container-time">
              <span class="timer_container-time_clock">00</span>
              <span class="timer_container-time_text">Дней</span>
            </h3>
            <h3 class="timer_container-time">
              <span class="timer_container-time_clock">00</span>
              <span class="timer_container-time_text">Часов</span>
            </h3>
            <h3 class="timer_container-time">
              <span class="timer_container-time_clock">00</span>
              <span class="timer_container-time_text">Минут</span>
            </h3>
            <h3 class="timer_container-time">
              <span class="timer_container-time_clock">00</span>
              <span class="timer_container-time_text">Секунд</span>
            </h3>
          </div>

          <div class="timer-finish">Поздравляю вас!</div>
        </div>
      </div>
    </main>

    <canvas id="canvas"></canvas>

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
